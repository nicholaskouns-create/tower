name: Deploy to GitHub Pages

# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions" (one time).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the deploy commit (run records pin local experiments to it)
        run: |
          printf '{"commit":"%s","ref":"%s","built_at":"%s","publisher":"actions-deploy-pages"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build.json
          mkdir -p _site
          cp -r index.html css js experiments build.json README.md og.jpg fibonacci-og.jpg _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
