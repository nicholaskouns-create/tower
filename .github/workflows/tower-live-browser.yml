name: Tower live browser navigation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'js/explorer.js'
      - 'js/github.js'
      - 'scripts/probe_live_explore.py'
      - '.github/workflows/tower-live-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation library
        run: python -m pip install playwright==1.56.0
      - name: Verify browser availability and probe syntax
        run: |
          google-chrome --version
          python -m py_compile scripts/probe_live_explore.py
      - name: Execute real public Tower browser and pinned paper route
        run: |
          python scripts/probe_live_explore.py \
            --output tower-explore-browser-evidence.json \
            --screenshot tower-explore-browser.png
      - name: Preserve browser evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-live-explore-browser-evidence
          path: |
            tower-explore-browser-evidence.json
            tower-explore-browser.png
          if-no-files-found: warn
